name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Rust Unit Tests & Format Check
  rust-check:
    name: Rust (Clippy, Format & Core Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./crates/cig_core -> target"

      - name: Check Rust Formatting
        run: cargo fmt --all --check

      - name: Rust Linter (Clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust Core Tests
        run: cargo test --workspace --verbose

  # 2. Python Test Matrix & CIG End-to-End Tests
  python-test:
    name: Test Suite (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: [rust-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and Install CIG Extension (maturin develop)
        run: |
          uv run maturin develop

      - name: Run Pytest Suite
        run: |
          uv run pytest tests/ -v --durations=10

  # 3. Build Release Wheels Artifacts (Linux, macOS, Windows)
  build-wheels:
    name: Build Wheels (${{ matrix.os }})
    needs: [python-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Wheels with Maturin Action
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Upload Wheel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
