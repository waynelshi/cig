[package]
name = "cig_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "_cig_core"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py310"] }
petgraph = { version = "0.6", features = ["serde-1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"